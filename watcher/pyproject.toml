[project]
name = "blog-watcher"
version = "0.1.0"
description = "File watcher service for blog content sync"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "watchdog>=6.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
