# Local watcher service (remote-file-notifier consumer)
# Run alongside the blog services on the host with access to the posts directory.
# Requires remote-file-notifier-client on traefik-proxy network.
#
# POSTS_DIR must be the host path — it's both the volume mount source
# AND the path registered with the notifier client (must match the local
# side of notifier client's path_mapping).

services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-watcher
    restart: unless-stopped
    environment:
      - DB_PATH=/data/db/blog.db
      - POSTS_DIR=${POSTS_DIR}
      - POSTS_MOUNT=${POSTS_MOUNT:-/data/posts}
      - DEBOUNCE_SECONDS=5
      - TZ=Asia/Shanghai
      # remote-file-notifier integration
      - NOTIFIER_API=http://remote-file-notifier-client:9877
      - CALLBACK_PORT=8080
      - SELF_URL=http://blog-watcher:8080
      - WATCH_EVENTS=closed,created,moved
      - WATCH_PATTERN=\.md$
      - WATCH_EXCLUDE=.meta,.title,.~*,.DS_Store,Thumbs.db
      # Optional public-origin=internal-base mappings, injected through .env.
      - IMAGE_URL_REWRITES=${IMAGE_URL_REWRITES:-}
    volumes:
      - ${DB_DIR}:/data/db
      - ${POSTS_DIR}:${POSTS_MOUNT:-/data/posts}
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
