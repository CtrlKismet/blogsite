services:
  # Python FastAPI backend (read-only API)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-api
    restart: unless-stopped
    environment:
      - DB_PATH=/data/db/blog.db
      - POSTS_DIR=/data/posts
      - TZ=Asia/Shanghai
    volumes:
      - ${DB_DIR}:/data/db:ro
      - ${POSTS_DIR}:/data/posts:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - caddy-net

  # Artalk comment system
  artalk:
    image: artalk/artalk-go
    container_name: blog-artalk
    restart: unless-stopped
    volumes:
      - artalk_data:/data
    expose:
      - "23366"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - caddy-net

volumes:
  artalk_data:

networks:
  caddy-net:
    external: true
